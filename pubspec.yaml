name: qafeel
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  connectivity_plus: ^6.1.2
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter

  #language
  flutter_localizations:
    sdk: flutter
  # Bloc
  flutter_bloc: ^9.1.1
  # UI
  flutter_dotenv: ^5.2.1
  flutter_native_splash: ^2.4.4
  flutter_screenutil: ^5.9.3
  get_it: ^8.0.3
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.1
  shimmer: ^3.0.0
  flutter_svg: ^2.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  # dart run build_runner build --delete-conflicting-outputs
  # build_runner: ^2.4.14
  # freezed: ^2.4.6
  # retrofit_generator: ^9.1.7
  # json_serializable: ^6.7.1
  # hive_generator: ^2.0.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

flutter:

  uses-material-design: true
  assets:
    - lang/ar.json
    - lang/en.json
    - .env.dev
    - .env.prod
    - assets/images/
    - assets/icons/
  # example:
  fonts:
    # Arabic Fonts
    - family: Arabic-Avenir
      fonts:
        - asset: assets/fonts/arabic/avenir_arabic/AvenirArabic-Heavy.otf
          weight: 900
        - asset: assets/fonts/arabic/avenir_arabic/AvenirArabic-Medium.otf
          weight: 800
        - asset: assets/fonts/arabic/avenir_arabic/AvenirArabic-Light.otf
          weight: 500
    # English Fonts
    - family: Poppins
      fonts:
        - asset: assets/fonts/english/poppins/Poppins-Bold.ttf
          weight: 900
        - asset: assets/fonts/english/poppins/Poppins-Medium.ttf
          weight: 800
        - asset: assets/fonts/english/poppins/Poppins-Regular.ttf
          weight: 500
